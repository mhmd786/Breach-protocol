services:
  - type: web
    name: breach-protocol
    runtime: node
    plan: free
    # If your repo has the project's package.json at the repo root, leave this
    # commented out. If everything sits inside a subfolder (e.g. you committed
    # an extracted zip as "breach-protocol/..."), uncomment the line below —
    # or set the same value in the Render dashboard under
    # Settings → Build & Deploy → Root Directory.
    # rootDir: breach-protocol
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is provided automatically by Render — server.ts reads process.env.PORT.
